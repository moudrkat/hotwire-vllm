name: Release

# Pushing a tag is the whole release. `git tag v0.1.0 && git push --tags`
# builds, verifies, publishes to PyPI, and opens a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # v0.1.0 must mean pyproject says 0.1.0 — PyPI never lets a version
      # be re-uploaded, so a mistyped tag would ship the wrong number for good.
      - name: Tag matches the version in pyproject.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$tag  pyproject=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match pyproject.toml version $pkg — bump one of them"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check --strict dist/*

      # The wheel must register the vLLM plugin entry point and carry the
      # agent guide; a packaging slip here installs clean and steers nothing.
      - name: Wheel carries the entry point and AGENTS.md
        run: |
          python - <<'PY'
          import pathlib, sys, zipfile

          wheel = next(iter(pathlib.Path("dist").glob("*.whl")), None)
          if wheel is None:
              sys.exit("::error::no wheel in dist/")
          zf = zipfile.ZipFile(wheel)
          names = zf.namelist()
          if not any(n.endswith("hotwire/AGENTS.md") for n in names):
              sys.exit(f"::error::{wheel.name} is missing hotwire/AGENTS.md")
          ep = next((n for n in names if n.endswith("entry_points.txt")), None)
          if ep is None or b"vllm.general_plugins" not in zf.read(ep):
              sys.exit(f"::error::{wheel.name} does not register vllm.general_plugins")
          print(f"{wheel.name}: entry point + AGENTS.md present")
          PY

      - name: Smoke test the built wheel
        run: |
          python -m venv /tmp/relcheck
          /tmp/relcheck/bin/pip install --quiet dist/*.whl
          /tmp/relcheck/bin/python -c "import hotwire, importlib.metadata as m; assert 'hotwire' in [e.name for e in m.entry_points(group='vllm.general_plugins')]"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hotwire-vllm
    permissions:
      id-token: write   # OIDC token for PyPI Trusted Publishing; no stored secret
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Open the release with notes from the commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
